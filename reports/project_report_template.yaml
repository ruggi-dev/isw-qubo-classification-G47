design_choices:
  correlation_computation: "Absolute Spearman correlation computed on the training prefix only, as required to avoid leakage from test rows during feature selection."
  QUBO_optimization_algorithm:
    algorithm_name: "simulated_annealing"
    library_used: "NumPy"
    reason_for_choice: "It is a simple and effective optimization method for a compact dense QUBO matrix and avoids the need for a specialized commercial solver."
  classification_algorithm:
    algorithm_name: "random_forest"
    library_used: "scikit-learn"
    reason_for_choice: "Random forest provides stable predictions on numeric tabular data, supports probability estimation, and works well with the reduced feature set produced by QUBO selection."
  gui_development: "PySide6"
  problems_encountered:
    - problem: "The main challenge was keeping the QUBO objective aligned with the specification while ensuring a correct train/test split and valid output schemas."
      solution: "The implementation computed correlations only from the training portion, validated inputs and outputs, and verified the final results by running the scripts and unit tests."
  notes: "The final solution implements the full pipeline: preprocessing, feature reduction, training, prediction, and evaluation, all in Python and validated with automated tests."

