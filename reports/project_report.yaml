design_choices:
  correlation_computation: "Absolute Spearman correlation is computed on the training prefix for feature selection."
  preprocessing_split: "Feature filtering, imputation, and z-score statistics are fitted on the ordered training prefix and then applied to both partitions."
  QUBO_optimization_algorithm:
    algorithm_name: "simulated_annealing"
    library_used: "NumPy"
    reason_for_choice: "It is suitable for the compact dense QUBO matrix and avoids requiring a specialized commercial solver."
  classification_algorithm:
    algorithm_name: "random_forest"
    library_used: "scikit-learn"
    reason_for_choice: "Random Forest supports probability estimates and provides a baseline classifier for the reduced numeric feature set."
  gui_development: "PySide6"
  problems_encountered:
    - problem: "The main challenge was matching the QUBO objective, train/test split, and output schemas to the specification."
      solution: "The implementation validates inputs, computes feature-selection correlations on the training prefix, and writes the required artifacts; automated tests cover the relevant behaviors."
    - problem: "The positive class is strongly underrepresented, so accuracy alone overstates model performance."
      solution: "The report includes class-specific precision, recall, and F1 alongside accuracy and ROC-AUC."
  notes: "The project implements preprocessing, QUBO-based feature selection, classifier training, prediction, evaluation, and a PySide6 GUI."

